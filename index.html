<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIPZ — Parduotuvė</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f6f6;color:#111}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;z-index:5}.bar,.wrap{max-width:1200px;margin:auto;padding:18px 20px}.bar{display:flex;align-items:center;gap:15px}.logo{font-size:28px;font-weight:900}.grow{flex:1}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:#111;color:#fff;cursor:pointer}input,select{border:1px solid #ccc;border-radius:10px;padding:11px;background:#fff}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.cats{display:flex;gap:8px;flex-wrap:wrap}.cats button{background:#fff;color:#111;border:1px solid #ccc}.cats .active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;overflow:hidden}.pic{aspect-ratio:1;background:#eee}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.price{font-weight:800;margin:8px 0}.muted{color:#666;font-size:14px}.sold{color:#b00020;font-weight:700}.drawer{position:fixed;right:0;top:0;width:min(430px,100%);height:100%;background:#fff;z-index:10;box-shadow:-8px 0 30px #0002;padding:22px;overflow:auto;transform:translateX(100%);transition:.25s}.drawer.open{transform:translateX(0)}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.close{float:right;background:#eee;color:#111}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal.show{display:flex}.box{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px}.box form{display:grid;gap:10px}.box input{width:100%}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.grow{flex-basis:100%}}</style></head><body><header><div class="bar"><div class="logo">DRIPZ</div><div class="grow"></div><button onclick="openCart()">Krepšelis <span id="count">0</span></button></div></header><main class="wrap"><h1>Prekių katalogas</h1><div class="controls"><input id="search" placeholder="Ieškoti prekės..." oninput="render()"><select id="sort" onchange="render()"><option value="new">Naujausios</option><option value="low">Kaina: nuo mažiausios</option><option value="high">Kaina: nuo didžiausios</option><option value="stock">Daugiausia sandėlyje</option><option value="az">Pavadinimas A–Ž</option></select></div><div class="cats" id="cats"></div><div class="grid" id="grid"></div></main><aside class="drawer" id="drawer"><button class="close" onclick="closeCart()">Uždaryti</button><h2>Krepšelis</h2><div id="cart"></div><h3 id="total"></h3><button style="width:100%" onclick="checkout()">Užsakyti</button></aside><div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>Užsakymas</h2><form onsubmit="submitOrder(event)"><input id="name" required placeholder="Vardas ir pavardė"><input id="email" required type="email" placeholder="El. paštas"><input id="phone" required placeholder="Telefonas"><input id="address" required placeholder="Adresas"><input id="city" required placeholder="Miestas"><input id="postal" required placeholder="Pašto kodas"><button>Pateikti užsakymą</button></form></div></div><script>const demo=[['DRIPZ Oversize džemperis','Džemperiai',59.99,12,'https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=80'],['DRIPZ Basic marškinėliai','Marškinėliai',29.99,25,'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80'],['DRIPZ Cargo kelnės','Kelnės',64.99,8,'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=900&q=80'],['DRIPZ Kepurė','Kepurės',24.99,16,'https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=900&q=80'],['DRIPZ Urban laikrodis','Laikrodžiai',89.99,5,'https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=900&q=80'],['DRIPZ Street akiniai','Akiniai',34.99,10,'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=900&q=80'],['DRIPZ Mini krepšys','Krepšiai',39.99,7,'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=900&q=80'],['DRIPZ Signature kvepalai','Kvepalai',49.99,9,'https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=900&q=80']].map((x,i)=>({id:i+1,name:x[0],category:x[1],price:x[2],stock:x[3],image:x[4]}));let products=JSON.parse(localStorage.getItem('dripz_products')||'null')||demo,cart=JSON.parse(localStorage.getItem('dripz_cart')||'[]'),cat='Visos';function save(){localStorage.setItem('dripz_products',JSON.stringify(products));localStorage.setItem('dripz_cart',JSON.stringify(cart));count.textContent=cart.reduce((a,x)=>a+x.qty,0)}function renderCats(){cats.innerHTML=['Visos',...new Set(products.map(p=>p.category))].map(c=>`<button class="${c===cat?'active':''}" onclick="setCat(${JSON.stringify(c)})">${c}</button>`).join('')}function setCat(c){cat=c;render()}function render(){renderCats();let q=search.value.toLowerCase(),s=sort.value,a=products.filter(p=>(cat==='Visos'||p.category===cat)&&p.name.toLowerCase().includes(q));a.sort((x,y)=>s==='low'?x.price-y.price:s==='high'?y.price-x.price:s==='stock'?y.stock-x.stock:s==='az'?x.name.localeCompare(y.name):y.id-x.id);grid.innerHTML=a.length?a.map(p=>`<article class="card"><div class="pic"><img src="${p.image}" alt="${p.name}"></div><div class="info"><div class="muted">${p.category}</div><b>${p.name}</b><div class="price">${p.price.toFixed(2)} €</div>${p.stock?`<button onclick="add(${p.id})">Į krepšelį</button>`:'<span class="sold">Išparduota</span>'}</div></article>`).join(''):'<p>Prekių nerasta.</p>'}function add(id){let x=cart.find(i=>i.id===id);x?x.qty++:cart.push({id,qty:1});save();openCart()}function openCart(){renderCart();drawer.classList.add('open')}function closeCart(){drawer.classList.remove('open')}function renderCart(){let t=0;cart.innerHTML=cart.length?cart.map(i=>{let p=products.find(x=>x.id===i.id);t+=p.price*i.qty;return `<div class="row"><div>${p.name}<br>${i.qty} × ${p.price.toFixed(2)} €</div><button onclick="removeItem(${i.id})">−</button></div>`}).join(''):'<p>Krepšelis tuščias.</p>';total.textContent='Iš viso: '+t.toFixed(2)+' €'}function removeItem(id){let x=cart.find(i=>i.id===id);x.qty--;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);save();renderCart()}function checkout(){if(!cart.length)return alert('Krepšelis tuščias.');modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function submitOrder(e){e.preventDefault();let orders=JSON.parse(localStorage.getItem('dripz_orders')||'[]');orders.push({id:Date.now(),name:name.value,email:email.value,phone:phone.value,address:address.value,city:city.value,postal:postal.value,items:cart,total:cart.reduce((t,i)=>t+products.find(p=>p.id===i.id).price*i.qty,0),date:new Date().toISOString(),status:'Naujas'});localStorage.setItem('dripz_orders',JSON.stringify(orders));cart=[];save();closeModal();closeCart();alert('Ačiū! Užsakymas priimtas.')}render();save();</script></body></html>
